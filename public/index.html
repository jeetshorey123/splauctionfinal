<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Sankalp Premier League Season 2">
  <title>Sankalp Premier League Season 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo-section">
          <img src="spl-logo.png" alt="SPL Logo" class="app-logo">
          <div class="title-section">
            <h1>Sankalp Premier League</h1>
            <span class="season-badge">Season 2</span>
            <button id="navHome" class="header-nav-btn active">Teams</button>
            <button id="navSchedule" class="header-nav-btn">Schedule</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="navbar" style="display: none;">
      <div class="nav-container">
        <button id="navHomeOld" class="nav-btn active">Teams</button>
        <button id="navScheduleOld" class="nav-btn">Schedule</button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="mainContent">
      <!-- Home Page - Teams Grid -->
      <div id="homePage" class="page active">
        <h2 class="page-title">Select a Team</h2>
        <div class="teams-grid" id="teamsGrid"></div>
      </div>

      <!-- Team Details Page -->
      <div id="teamDetailsPage" class="page">
        <button id="backToHome" class="back-btn">← Back to Teams</button>
        <div id="teamDetails"></div>
      </div>

      <!-- Schedule Page -->
      <div id="schedulePage" class="page">
        <h2 class="page-title">Tournament Schedule</h2>
        <button id="downloadScheduleBtn" class="download-btn">📥 Download Schedule as Image</button>
        <div class="schedule-info">
          <div class="event-banner">
            <h3>🏏 Inauguration Ceremony</h3>
            <p>25th January 2026 | 9:30 AM - 10:30 AM</p>
          </div>
          <div class="event-banner">
            <h3>👶 Kids Match</h3>
            <p>26th January 2026 | 11:00 AM</p>
          </div>
        </div>
        <div id="scheduleContent"></div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
